services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: odds
      POSTGRES_USER: odds
      POSTGRES_PASSWORD: odds
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odds -d odds"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://odds:odds@db:5432/odds
      REDIS_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports: ["8000:8000"]
    depends_on: [db, redis]
  odds-simulator:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://odds:odds@db:5432/odds
      REDIS_URL: redis://redis:6379/0
    command: python manage.py simulate_odds --interval 5
    depends_on: [api, redis]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    depends_on: [api]
volumes:
  postgres_data:
