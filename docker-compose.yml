services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fairgame
      POSTGRES_USER: fairgame
      POSTGRES_PASSWORD: fairgame_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairgame -d fairgame"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DEBUG: "1"
      DJANGO_SECRET_KEY: "local-development-only-change-me"
      DATABASE_URL: "postgres://fairgame:fairgame_dev_only@db:5432/fairgame"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      LEDGER_MODE: "local"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: "http://localhost:8000/api"
    ports: ["5173:5173"]
    depends_on: [backend]
  